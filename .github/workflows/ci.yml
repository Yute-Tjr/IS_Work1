name: CI

# Runs automatically on every push and every pull request
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate Bandit reports
        run: |
          mkdir -p reports
          bandit -r app -f html -o reports/bandit-report.html --exit-zero
          bandit -r app -f json -o reports/bandit-report.json --exit-zero
          {
            echo "## Bandit SAST report"
            echo '```'
            bandit -r app -f txt --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/

      - name: Fail on medium or high severity issues
        run: bandit -r app --severity-level medium --confidence-level medium

  sca-pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate pip-audit reports
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip-audit-report.json || true
          {
            echo "## pip-audit SCA report (requirements.txt)"
            # 2>&1: the "No known vulnerabilities found" message is printed on stderr
            pip-audit -r requirements.txt -f markdown --desc on --progress-spinner off 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: reports/

      - name: Fail on known vulnerable dependencies
        run: pip-audit -r requirements.txt --desc on
