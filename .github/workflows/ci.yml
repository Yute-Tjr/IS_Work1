name: CI

# Runs automatically on every push and every pull request
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate Bandit reports
        run: |
          mkdir -p reports
          bandit -r app -f html -o reports/bandit-report.html --exit-zero
          bandit -r app -f json -o reports/bandit-report.json --exit-zero
          {
            echo "## Bandit SAST report"
            echo '```'
            bandit -r app -f txt --exit-zero
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: reports/

      - name: Fail on medium or high severity issues
        run: bandit -r app --severity-level medium --confidence-level medium

  sca-pip-audit:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate pip-audit reports
        run: |
          mkdir -p reports
          pip-audit -r requirements.txt -f json -o reports/pip-audit-report.json || true
          {
            echo "## pip-audit SCA report (requirements.txt)"
            # 2>&1: the "No known vulnerabilities found" message is printed on stderr
            pip-audit -r requirements.txt -f markdown --desc on --progress-spinner off 2>&1 || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: reports/

      - name: Fail on known vulnerable dependencies
        run: pip-audit -r requirements.txt --desc on

  sca-snyk:
    name: SCA (Snyk)
    runs-on: ubuntu-latest
    env:
      # Free personal access token from https://app.snyk.io/account/personal-access-tokens,
      # stored in Settings -> Secrets and variables -> Actions as SNYK_TOKEN
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip notice
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN secret is not set, so the Snyk scan was skipped."

      - uses: actions/setup-python@v7
        if: env.SNYK_TOKEN != ''
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Snyk resolves the dependency tree from the packages installed in the environment
      - name: Install dependencies
        if: env.SNYK_TOKEN != ''
        run: pip install -r requirements.txt

      - uses: snyk/actions/setup@v1
        if: env.SNYK_TOKEN != ''

      - name: Run Snyk dependency scan
        id: snyk
        if: env.SNYK_TOKEN != ''
        run: |
          mkdir -p reports
          set +e
          snyk test --file=requirements.txt --package-manager=pip \
            --json-file-output=reports/snyk-report.json | tee reports/snyk-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          {
            echo "## Snyk SCA report (requirements.txt)"
            echo '```'
            cat reports/snyk-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npx --yes snyk-to-html@3 -i reports/snyk-report.json -o reports/snyk-report.html

      - name: Upload Snyk report
        if: always() && env.SNYK_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: snyk-report
          path: reports/

      # snyk test exit codes: 0 = no issues, 1 = vulnerabilities found, 2+ = scan error
      - name: Fail on known vulnerable dependencies
        if: env.SNYK_TOKEN != ''
        run: |
          case "${{ steps.snyk.outputs.exit_code }}" in
            0) echo "Snyk: no known vulnerabilities found" ;;
            1) echo "::error::Snyk found vulnerable dependencies"; exit 1 ;;
            *) echo "::error::Snyk scan failed (exit code ${{ steps.snyk.outputs.exit_code }})"; exit 1 ;;
          esac
